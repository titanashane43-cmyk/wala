<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css" />
    <title>Answer Me</title>
</head>    
<body>
     <!-- Envelope Screen-->
      <div class="envelope-container">
        <img src="envelop.jpeg" alt="Envelope" id="envelope" />
        <p>⋆Letter for You ⋆</p>   
      </div>

     <!-- Letter Screen-->
      <div id="letter-container">
        <div class="letter-window">
            <h1 id="letter-title"> Are you okay?</h1>

            <img src="images (1).jpeg" class="cat" id="letter-cat" alt="Two cuddly cats" />
            <img src="cute.jpeg" class="yes-cat" id="yes-cat" alt="Happy cat saying yes" />

            <div class="buttons" id="lettr-buttons">
                <img src="images.png" class="btn yes-btn" alt="Yes" role="button" tabindex="0" />

                <div class="no-wrapper">
                    <img src="no.png" class="btn no-btn" alt="No" role="button" tabindex="0" />
                </div>
            </div>

            <p id="final-text" class="final-text" style="display: none;">
                <strong> Hi Yanie</strong> You can do it, keep shining
            </p>
        </div>
      </div>
    <script src="script.js"></script>
</body>
</html>
